<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Adri Sweets · Cotizador</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#D9A0A4"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
:root{--rose:#D9A0A4;--rd:#B96F7A;--gold:#8A6232;--bl:#FBF1F0;--ink:#241A1A;--ln:#EBD3D3;--mut:#7a6666}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fff;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:3px solid var(--rose);background:#fff;position:sticky;top:0;z-index:5}
header img{height:46px}header span{font-weight:700;color:var(--gold);flex:1}
#inst{background:var(--rd);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-weight:600}
main{padding:14px 16px;max-width:620px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:14px 0;font-size:11.5px;color:var(--mut);font-weight:600}nav button.on{color:var(--rd);box-shadow:inset 0 3px 0 var(--rd)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 0;flex:1}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink);margin-top:4px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--rd);outline-offset:1px}
.nm{font-weight:600;margin:0 0 6px}.row{display:flex;gap:10px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:var(--rd);color:#fff;margin-top:12px}.btn.alt{background:var(--bl);color:var(--gold);border:1px solid var(--rose)}
.lnk{background:none;border:0;color:var(--rd);font:inherit;font-weight:600;padding:10px 0}
.seg{display:flex;margin-top:12px;border:1px solid var(--rose);border-radius:12px;overflow:hidden}.seg button{flex:1;border:0;padding:11px;background:#fff;font:inherit;font-weight:600;color:var(--gold)}.seg .on{background:var(--rose);color:#fff}
.card{border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:12px}.tap{cursor:pointer}.sum{background:var(--bl);border-color:var(--rose)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-top:8px;gap:8px}.warn{color:#b3261e;font-weight:600}
.x{background:none;border:0;color:var(--rd);font-weight:700;padding:6px}
.line{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.line>span{flex:1}.line select{margin:0;flex:2}.line input{margin:0;width:80px}.tot{font-size:19px}
h3{color:var(--gold);margin:22px 0 4px}.empty,.hint{color:var(--mut);font-size:14px}
#res{background:var(--bl);border:1px solid var(--rose);border-radius:16px;padding:14px;margin-top:14px}
#rp{font-size:40px;font-weight:800;color:var(--rd);line-height:1.1}.neg{color:#b3261e}
.kv{display:flex;justify-content:space-between;padding:3px 0}
details.help{background:var(--bl);border:1px dashed var(--rose);border-radius:12px;padding:9px 12px;margin:10px 0;font-size:14px;color:var(--mut)}details.help summary{font-weight:700;color:var(--gold);cursor:pointer}details.help div{margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.grid .card{margin:0}.big{font-size:24px;font-weight:800;color:var(--rd);line-height:1.15}.big.neg{color:#b3261e}.fh{font-size:12.5px;color:var(--mut);margin-top:4px}
#ov{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20;overflow:auto}#ov[hidden]{display:none}#ov img{max-width:100%;max-height:100%}.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.fotos div{position:relative}.fotos img{width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}.fotos .x{position:absolute;top:2px;right:2px;background:#fffd;border-radius:50%}
@media(prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:scale(.97)}}
</style></head><body>
<header><img src="logo.png" alt="Adri Sweets"><span>Cotizador</span><button id="inst" hidden>Instalar</button></header>
<main id="v"></main><nav id="nav"></nav><div id="ov" hidden onclick="this.hidden=true"></div>
<script>
const K='adri_v1',UM={g:['g',1],kg:['g',1000],ml:['ml',1],l:['ml',1000],u:['u',1]};
const def={cfg:{biz:'Adri Sweets',tel:'',tasa:1,margen:40,mo:2,ind:5,abono:50,red:0,pm:'',bin:'',cond:'Para reservar la fecha se requiere el abono. Precios sujetos a cambio según el costo de la materia prima.'},ings:[],recs:[],hist:[],cart:[],lotes:[],peds:[],chk:{}};
let S;try{S=JSON.parse(localStorage[K]);S.cfg={...def.cfg,...S.cfg}}catch(e){S=null}if(!S||!S.cfg)S=JSON.parse(JSON.stringify(def));S.lotes=S.lotes||[];S.peds=S.peds||[];S.chk=S.chk||{};
const save=()=>localStorage[K]=JSON.stringify(S),$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const n=v=>parseFloat(String(v).replace(',','.'))||0,E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=v=>'$'+(+v||0).toFixed(2),bs=v=>'Bs '+((+v||0)*S.cfg.tasa).toLocaleString('es-VE',{maximumFractionDigits:2}),fd=d=>d.split('-').reverse().join('/');
const usd=i=>i.cur==='Bs'?i.price/S.cfg.tasa:i.price,bu=i=>UM[i.unit][0],uc=i=>{const b=i.qty*UM[i.unit][1];return b?usd(i)/b:0};
const ing=id=>S.ings.find(x=>x.id===id),rec=id=>S.recs.find(x=>x.id===id);
function cost(r,f=1,dp=0){let a=0;r.items.forEach(it=>{const i=ing(it.i);if(i)a+=uc(i)*it.q;else{const sb=rec(it.i);if(sb&&dp<4)a+=sum(cost(sb,1,dp+1))/((sb.kg||1)*1000)*it.q}});return{ing:a*f,merma:a*r.merma/100*f,ind:a*S.cfg.ind/100*f,lab:r.horas*S.cfg.mo*f,fijo:r.empaque+r.decor}}
const sum=c=>c.ing+c.merma+c.ind+c.lab+c.fijo,tot=r=>sum(cost(r,1));
function price(c,m){m=Math.min(m,95);const v=c/(1-m/100),r=S.cfg.red;return r>0?Math.ceil(v/r)*r:v}
const TABS=[['q','Cotizar'],['p','Pedidos'],['v','Ventas'],['r','Recetas'],['i','Ingred.'],['m','Más']];
let T='q',R=null,Q={rid:'',mode:'kg',qty:1,extra:0,marg:'',pf:''},C={nom:'',tel:'',fec:'',nota:''};
const go=t=>{T=t;R=null;AL=[];render()};
const HP=()=>'';
function render(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===T?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#v').innerHTML={q:vQ,p:vP,v:vV,r:vR,i:vI,m:vM}[T]();if(T==='q')upd()}
/* COTIZAR */
function vQ(){if(!S.recs.length)return`<p class="empty">Aún no tienes recetas. Carga tus <b>ingredientes</b> y luego crea una <b>receta</b>.</p>`+cartH();
if(!Q.rid||!rec(Q.rid))Q.rid=S.recs[0].id;
return HP('¿Cómo funciona Cotizar?','Elige una receta ya guardada y cuánto vas a vender (por kilo o por porción). La app te dice <b>cuánto te cuesta</b>, <b>a cuánto venderlo</b> y <b>cuánto ganas</b>. Con «Agregar a la cotización» armas el documento para tu cliente.')+`<label>Producto<select onchange="Q.rid=this.value;Q.pf='';upd()">${S.recs.map(r=>`<option value="${r.id}" ${r.id===Q.rid?'selected':''}>${E(r.name)}</option>`).join('')}</select></label>
<div class="seg"><button class="${Q.mode==='kg'?'on':''}" onclick="Q.mode='kg';Q.pf='';render()">Por kilo</button><button class="${Q.mode==='por'?'on':''}" onclick="Q.mode='por';Q.pf='';render()">Por porción</button></div>
<div class="row"><label>${Q.mode==='kg'?'Kilos':'Porciones'}<input type="number" inputmode="decimal" value="${Q.qty}" oninput="Q.qty=n(this.value);Q.pf='';upd()"></label><label>Extras $<input type="number" inputmode="decimal" value="${Q.extra}" oninput="Q.extra=n(this.value);Q.pf='';upd()"></label><label>Margen %<input type="number" inputmode="decimal" placeholder="${S.cfg.margen}" value="${Q.marg}" oninput="Q.marg=this.value;Q.pf='';upd()"></label></div>
<div id="res"><div class="kv"><span>Tu costo</span><b id="rc"></b></div><div style="margin-top:8px;color:var(--mut)">Precio sugerido</div><div id="rp"></div><div id="rpb" class="hint"></div>
<div class="kv"><span>Tu ganancia</span><b id="rg"></b></div><div class="kv"><span>Precio unitario</span><b id="ru"></b></div>
<label>Precio final (opcional, si quieres otro)<input id="pf" type="number" inputmode="decimal" oninput="Q.pf=this.value;upd()"></label><button class="btn" onclick="add()">Agregar a la cotización</button></div>`+cartH()}
function calc(){const r=rec(Q.rid);if(!r)return null;const f=(Q.qty/(Q.mode==='kg'?r.kg:r.por))||0,t=sum(cost(r,f))+Q.extra,m=Q.marg===''?S.cfg.margen:n(Q.marg);return{r,t,f,p:price(t,m)}}
function upd(){const c=calc();if(!c||!$('#rc'))return;const pf=n(Q.pf)||c.p;$('#rc').textContent=fm(c.t);$('#rp').textContent=fm(c.p);$('#rpb').textContent=bs(c.p);
$('#rg').textContent=fm(pf-c.t)+' ('+(pf?((pf-c.t)/pf*100).toFixed(0):0)+'%)';$('#rg').className=pf<c.t?'neg':'';
$('#ru').textContent=fm(pf/(Q.qty||1))+(Q.mode==='kg'?' por kilo':' por porción');$('#pf').placeholder=c.p.toFixed(2)}
function add(){const c=calc();if(!c||!Q.qty)return;S.cart.push({t:`${c.r.name} · ${Q.qty} ${Q.mode==='kg'?'kg':'porciones'}`,p:+(n(Q.pf)||c.p).toFixed(2),rid:c.r.id,f:c.f,c:+c.t.toFixed(2)});Q.pf='';save();render()}
function cartH(){const t=S.cart.reduce((a,l)=>a+l.p,0);return`<h3>Cotización para el cliente</h3>`+(S.cart.length?S.cart.map((l,i)=>`<div class="line"><span>${E(l.t)}</span><b>${fm(l.p)}</b><button class="x" aria-label="Quitar" onclick="S.cart.splice(${i},1);save();render()">✕</button></div>`).join('')+`<div class="line tot"><span>Total</span><b>${fm(t)}</b></div>
<div class="row"><label>Cliente<input value="${E(C.nom)}" oninput="C.nom=this.value"></label><label>Teléfono<input type="tel" inputmode="tel" value="${E(C.tel)}" oninput="C.tel=this.value"></label></div><div class="row"><label>Fecha del evento<input type="date" value="${C.fec}" oninput="C.fec=this.value"></label><label>Abono %<input type="number" value="${S.cfg.abono}" oninput="S.cfg.abono=n(this.value);save()"></label></div>
<label>Detalles (sabor, diseño, mensaje)<textarea rows="2" oninput="C.nota=this.value">${E(C.nota)}</textarea></label>
<button class="btn" onclick="share(mkQ())">Enviar cotización (imagen)</button><button class="btn alt" onclick="wa()">Enviar como texto por WhatsApp</button><button class="btn alt" onclick="toPed()">Convertir en pedido</button><button class="lnk" onclick="S.cart=[];save();render()">Vaciar cotización</button>`:`<p class="empty">Agrega productos arriba para armar la cotización.</p>`)}
function mkQ(){const q={d:Date.now(),nom:C.nom,fec:C.fec,nota:C.nota,lines:S.cart.map(l=>({...l})),tot:S.cart.reduce((a,l)=>a+l.p,0),ab:S.cfg.abono};q.k=JSON.stringify([q.nom,q.fec,q.nota,q.lines,q.ab]);if(S.hist[0]&&S.hist[0].k===q.k)S.hist[0].d=q.d;else S.hist.unshift(q);S.hist=S.hist.slice(0,200);save();return q}
const qtxt=q=>{const ab=q.tot*q.ab/100;return`*${S.cfg.biz} · Cotización*\n`+(q.nom?`Cliente: ${q.nom}\n`:'')+(q.fec?`Fecha del evento: ${fd(q.fec)}\n`:'')+'\n'+q.lines.map(l=>`• ${l.t}: ${fm(l.p)}`).join('\n')+(q.nota?`\n\n${q.nota}`:'')+`\n\n*Total: ${fm(q.tot)}*`+(S.cfg.tasa>1?` (${bs(q.tot)})`:'')+`\nAbono para reservar (${q.ab}%): ${fm(ab)}\nSaldo: ${fm(q.tot-ab)}`+(payTxt().length?'\n\n*Formas de pago*\n'+payTxt().join('\n'):'')+`\n\n${S.cfg.cond}`};
const payTxt=()=>[S.cfg.pm&&'Pago móvil: '+S.cfg.pm.replace(/\n/g,' · '),S.cfg.bin&&'Binance: '+S.cfg.bin.replace(/\n/g,' · ')].filter(Boolean);
const wa=()=>wsp(C.tel,qtxt(mkQ()));
function wrap(x,t,mw){const o=[];String(t).split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{const k=l?l+' '+w:w;if(x.measureText(k).width>mw&&l){o.push(l);l=w}else l=k});o.push(l)});return o}
async function mkImg(q){const c=document.createElement('canvas'),x=c.getContext('2d'),W=900;x.font='26px sans-serif';
const L=q.lines.map(l=>wrap(x,l.t,620)),N=q.nota?wrap(x,q.nota,800):[];x.font='22px sans-serif';const D=wrap(x,S.cfg.cond,800);x.font='24px sans-serif';const P=payTxt().map(t=>wrap(x,t,800));
c.width=W;c.height=440+L.reduce((a,l)=>a+l.length*34+22,0)+(N.length?N.length*34+50:0)+280+D.length*30+60+(P.length?P.reduce((a,l)=>a+l.length*32,0)+70:0);const H=c.height;
x.fillStyle='#fff';x.fillRect(0,0,W,H);
const im=await new Promise(r=>{const m=new Image();m.onload=()=>r(m);m.onerror=()=>r(null);m.src='logo.png'});
if(im){const h=190,w=im.width*h/im.height;x.drawImage(im,(W-w)/2,30,w,h)}
x.fillStyle='#D9A0A4';x.fillRect(50,245,W-100,4);let y=310;x.fillStyle='#8A6232';x.font='bold 40px sans-serif';x.fillText('Cotización',50,y);
x.fillStyle='#241A1A';x.font='26px sans-serif';if(q.nom){y+=46;x.fillText('Cliente: '+q.nom,50,y)}if(q.fec){y+=40;x.fillText('Fecha del evento: '+fd(q.fec),50,y)}y+=30;
L.forEach((ls,i)=>{y+=44;x.textAlign='left';x.font='26px sans-serif';ls.forEach((t,j)=>x.fillText(t,50,y+j*34));x.textAlign='right';x.font='bold 26px sans-serif';x.fillText(fm(q.lines[i].p),W-50,y);x.textAlign='left';y+=(ls.length-1)*34+8;x.fillStyle='#EBD3D3';x.fillRect(50,y+10,W-100,1);x.fillStyle='#241A1A'});
if(N.length){y+=50;x.font='italic 24px sans-serif';x.fillStyle='#6b5555';N.forEach((t,j)=>x.fillText(t,50,y+j*34));y+=(N.length-1)*34}
y+=70;x.fillStyle='#241A1A';x.font='bold 38px sans-serif';x.fillText('Total',50,y);x.textAlign='right';x.fillText(fm(q.tot),W-50,y);
if(S.cfg.tasa>1){y+=40;x.font='24px sans-serif';x.fillStyle='#6b5555';x.fillText(bs(q.tot),W-50,y)}
const ab=q.tot*q.ab/100;x.fillStyle='#241A1A';x.font='26px sans-serif';y+=50;x.textAlign='left';x.fillText(`Abono para reservar (${q.ab}%)`,50,y);x.textAlign='right';x.fillText(fm(ab),W-50,y);
y+=40;x.textAlign='left';x.fillText('Saldo',50,y);x.textAlign='right';x.fillText(fm(q.tot-ab),W-50,y);
if(P.length){y+=60;x.textAlign='left';x.fillStyle='#8A6232';x.font='bold 26px sans-serif';x.fillText('Formas de pago',50,y);x.fillStyle='#241A1A';x.font='24px sans-serif';P.forEach(ls=>ls.forEach(t=>{y+=32;x.fillText(t,50,y)}))}
y+=70;x.textAlign='left';x.font='22px sans-serif';x.fillStyle='#8a7a7a';D.forEach((t,j)=>x.fillText(t,50,y+j*30));y+=D.length*30+30;
x.fillStyle='#B96F7A';x.font='bold 26px sans-serif';x.textAlign='center';x.fillText(S.cfg.biz+(S.cfg.tel?' · '+S.cfg.tel:''),W/2,y+20);return c}
async function share(q){const c=await mkImg(q);c.toBlob(b=>{const f=new File([b],'Cotizacion-'+S.cfg.biz.replace(/\W+/g,'-')+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}})}
/* INGREDIENTES */
const mI=i=>{const d=Math.floor((Date.now()-i.d)/864e5);return`<span>$${uc(i)<0.01?uc(i).toFixed(5):uc(i).toFixed(3)} por ${bu(i)}</span><span class="${d>30?'warn':''}">${d>30?'Precio de hace '+d+' días: actualízalo':d<1?'Actualizado hoy':'Actualizado hace '+d+' d'}</span>`};
function vI(){return`<div id="al">${alH()}</div><button class="btn" onclick="S.ings.unshift({id:uid(),name:'',qty:1,unit:'kg',price:0,cur:'USD',d:Date.now()});save();render()">+ Ingrediente</button>${HP('¿Para qué sirve Ingredientes?','Es tu <b>lista de precios</b>. Escribe cada ingrediente como lo compras: ej. Harina · 1 · kg · $2. Cuando suba de precio, cambia el precio aquí y <b>todas las recetas se recalculan solas</b>. Usa kg, g, l, ml o u (unidad, ej. huevos). Si compras el azúcar por kilo, regístrala en kg y en la receta pon los gramos.')}`+S.ings.map(i=>`<div class="card"><input class="nm" placeholder="Ingrediente" value="${E(i.name)}" onchange="upI('${i.id}','name',this.value)">
<div class="row"><label>Cantidad<input type="number" inputmode="decimal" value="${i.qty}" onchange="upI('${i.id}','qty',n(this.value))"></label><label>Unidad<select onchange="upI('${i.id}','unit',this.value)">${Object.keys(UM).map(u=>`<option ${u===i.unit?'selected':''}>${u}</option>`).join('')}</select></label>
<label>Precio<input type="number" inputmode="decimal" value="${i.price}" onchange="upI('${i.id}','price',n(this.value))"></label><label>Moneda<select onchange="upI('${i.id}','cur',this.value)">${['USD','Bs'].map(u=>`<option ${u===i.cur?'selected':''}>${u}</option>`).join('')}</select></label></div>
<div class="meta" id="m_${i.id}">${mI(i)}</div><div class="meta"><span></span><button class="x" onclick="delI('${i.id}')">Borrar</button></div></div>`).join('')}
let AL=[];
const alH=()=>AL.length?`<div class="card sum"><b>Cambió el costo de tus recetas</b>`+AL.map(x=>`<div class="kv"><span>${E(x.n)}</span><b class="${x.z>x.a?'neg':''}">${fm(x.a)} → ${fm(x.z)}</b></div>`).join('')+`</div>`:'';
function upI(id,k,v){const i=ing(id),b=S.recs.map(tot);i[k]=v;if(k!=='name')i.d=Date.now();save();if(k!=='name'){$('#m_'+id).innerHTML=mI(i);AL=S.recs.map((r,j)=>({n:r.name,a:b[j],z:tot(r)})).filter(x=>Math.abs(x.z-x.a)>0.005);$('#al').innerHTML=alH()}}
function delI(id){if(S.recs.some(r=>r.items.some(t=>t.i===id))&&!confirm('Este ingrediente está en una receta. ¿Borrar igual?'))return;S.ings=S.ings.filter(i=>i.id!==id);save();render()}
/* RECETAS */
function vR(){const r=R&&rec(R);if(r)return vRE(r);return HP('¿Qué es una receta?','Aquí guardas <b>una sola vez</b> cada torta o postre con sus ingredientes. Después, para cotizar, solo la eliges y todo se calcula con los precios de hoy. <b>Toca una tarjeta</b> para ver o editar sus detalles.')+`<button class="btn" onclick="newR()">+ Nueva receta</button><div class="grid">`+S.recs.map(r=>{const t=tot(r),p=price(t,S.cfg.margen);return`<div class="card tap" onclick="R='${r.id}';render()"><b>${E(r.name||'Sin nombre')}</b><div class="fh">Rinde ${r.kg} kg · ${r.por} porciones</div><div class="fh">Te cuesta hacerla</div><b>${fm(t)}</b><div class="fh">Vender cada porción a</div><div class="big">${fm(p/(r.por||1))}</div><div class="fh">o ${fm(p/(r.kg||1))} por kilo</div></div>`}).join('')+`</div>`+(S.recs.length?'':'<p class="empty">Aún no tienes recetas.</p>')}
function newR(){const r={id:uid(),name:'',kg:1,por:10,merma:5,horas:1,empaque:0,decor:0,items:[]};S.recs.unshift(r);R=r.id;save();render()}
function vRE(r){const o=S.ings.map(i=>`<option value="${i.id}">${E(i.name||'(sin nombre)')}</option>`).join('')+S.recs.filter(x=>x.id!==r.id).map(x=>`<option value="${x.id}">Receta: ${E(x.name)}</option>`).join(''),f=(k,l)=>`<label>${l}<input type="number" inputmode="decimal" value="${r[k]}" onchange="upR('${k}',n(this.value))"></label>`;
return`<button class="lnk" onclick="R=null;render()">← Recetas</button><input class="nm" value="${E(r.name)}" placeholder="Nombre (ej. Torta de chocolate)" onchange="upR('name',this.value)">

function pDone(id){const p=ped(id);p.done=!p.done;p.dd=Date.now();save();render()}
function pDel(id){if(confirm('¿Borrar este pedido?')){S.peds=S.peds.filter(p=>p.id!==id);save();render()}}
function need(a){const m={},add=(r,f,dp)=>r.items.forEach(it=>{const i=ing(it.i),g=f*(1+r.merma/100);if(i)m[i.id]=(m[i.id]||0)+it.q*g;else{const sb=rec(it.i);if(sb&&dp<4)add(sb,it.q*g/((sb.kg||1)*1000),dp+1)}});a.forEach(p=>p.lines.forEach(l=>{const r=rec(l.rid);if(r)add(r,l.f||0,0)}));return m}
function shopD(a,all){const sel=all?a:a.filter(p=>PW==='todos'||(p.fec&&dias(p.fec)<=7)),m=need(sel);let tot=0;const rows=Object.keys(m).filter(k=>ing(k)).map(k=>{const i=ing(k),b=i.qty*UM[i.unit][1],packs=Math.max(1,Math.ceil(m[k]/b-1e-9)),c=packs*usd(i),u=bu(i),v=m[k],nd=u==='g'&&v>=1000?(v/1000).toFixed(2)+' kg':u==='ml'&&v>=1000?(v/1000).toFixed(2)+' l':Math.round(v*10)/10+' '+u;tot+=c;return{k,i,nd,packs,c}});return{rows,tot}}
const shopC=(d,w)=>d.rows.length?`<div class="grid">`+d.rows.map(r=>`<div class="card" style="${S.chk[r.k]?'opacity:.5':''}"><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" style="width:22px;height:22px;margin:0;flex:none" ${S.chk[r.k]?'checked':''} onchange="S.chk['${r.k}']=this.checked;save();render()"><b>${E(r.i.name)}</b></label><div class="fh">Necesitas ${r.nd}</div><div>Comprar <b>${r.packs} × ${r.i.qty} ${r.i.unit}</b></div><div class="big" style="font-size:18px">${fm(r.c)}</div></div>`).join('')+`</div><div class="line tot"><span>Gasto estimado</span><b>${fm(d.tot)}</b></div><button class="btn alt" onclick="shareList('${w}')">Enviar lista por WhatsApp</button><button class="lnk" onclick="S.chk={};save();render()">Desmarcar todo</button>`:'<p class="empty">No hay nada que comprar.</p>';
function shopH(a){return`<h3>Lista de compras</h3><div class="seg"><button class="${PW==='sem'?'on':''}" onclick="PW='sem';render()">Próx. 7 días</button><button class="${PW==='todos'?'on':''}" onclick="PW='todos';render()">Todos los pedidos</button></div>`+shopC(shopD(a),'p')}
function shareList(w){const d=w==='l'?shopD(planL(),1):shopD(S.peds.filter(p=>!p.done));wsp('','*Lista de compras*\n'+d.rows.map(r=>`• ${r.i.name}: ${r.packs} × ${r.i.qty} ${r.i.unit}`).join('\n')+`\nEstimado: ${fm(d.tot)}`)}
/* MÁS */
let M_='rep';
function vM(){return`<div class="seg">${[['rep','Reporte'],['hist','Cotizaciones'],['aj','Ajustes']].map(([k,l])=>`<button class="${M_===k?'on':''}" onclick="M_='${k}';render()">${l}</button>`).join('')}</div>`+({rep:vRep,hist:vH,aj:vA})[M_]()}
function vRep(){const t=new Date(),im=x=>{const d=new Date(x);return d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear()},G={};let iv=0,co=0;
S.peds.filter(p=>p.done&&im(p.dd||p.d)).forEach(p=>p.lines.forEach(l=>{iv+=l.p;co+=l.c||0;const k=(rec(l.rid)||{}).name||l.t;G[k]=(G[k]||0)+l.p-(l.c||0)}));
S.lotes.filter(l=>!l.plan&&im(l.d)).forEach(l=>{const v=sold(l)*l.pp;iv+=v;co+=l.cost;G[l.name]=(G[l.name]||0)+v-l.cost});
const top=Object.entries(G).sort((a,b)=>b[1]-a[1])[0];
return`<h3>Este mes</h3><div class="grid">${cd('Vendido',fm(iv))}${cd('Costos',fm(co))}${cd('Ganancia',fm(iv-co))}${cd('Más rentable',top?E(top[0])+'<br><small>'+fm(top[1])+'</small>':'—')}</div>`}
/* HISTORIAL */
function vH(){return S.hist.length?S.hist.map((q,i)=>`<div class="card"><b>${E(q.nom||'Sin nombre')}</b> · ${fm(q.tot)}<div class="meta"><span>${new Date(q.d).toLocaleDateString('es-VE')}${q.fec?' · evento '+fd(q.fec):''}</span></div><div class="meta">${E(q.lines.map(l=>l.t).join(', '))}</div>
<div class="row"><button class="btn alt" onclick="share(S.hist[${i}])">Reenviar</button><button class="btn alt" onclick="dupH(${i})">Duplicar</button><button class="btn alt" onclick="if(confirm('¿Borrar?')){S.hist.splice(${i},1);save();render()}">Borrar</button></div></div>`).join(''):`<p class="empty">Aquí aparecerán las cotizaciones que envíes.</p>`}
function dupH(i){const q=S.hist[i];S.cart=q.lines.map(l=>({...l}));C={nom:q.nom,fec:q.fec,nota:q.nota};go('q')}
/* AJUSTES */
function vA(){const g=(k,l,h='')=>`<label>${l}<input type="number" inputmode="decimal" value="${S.cfg[k]}" onchange="cf('${k}',n(this.value))"></label>${h?`<div class="hint">${h}</div>`:''}`;
return HP('¿Qué es esto?','Son tus reglas generales: el <b>margen</b> es lo que quieres ganar sobre el precio de venta, la <b>tasa</b> convierte los Bs a $, y las <b>formas de pago</b> salen en tus cotizaciones y recordatorios.')+`<label>Nombre del negocio<input value="${E(S.cfg.biz)}" onchange="cf('biz',this.value)"></label><label>Teléfono (sale en la cotización)<input value="${E(S.cfg.tel)}" onchange="cf('tel',this.value)"></label>
${g('tasa','Tasa del dólar (Bs por $1)')}${g('margen','Margen de ganancia % (sobre el precio de venta)')}${g('mo','Tu hora de trabajo $')}${g('ind','Gas, luz y otros % (sobre ingredientes)')}${g('abono','Abono para reservar %')}${g('red','Redondear precio hacia arriba a múltiplos de $')}
<h3>Formas de pago (salen en la cotización)</h3><label>Pago móvil (banco, teléfono, cédula)<textarea rows="2" onchange="cf('pm',this.value)">${E(S.cfg.pm)}</textarea></label><label>Binance (correo o Pay ID)<input value="${E(S.cfg.bin)}" onchange="cf('bin',this.value)"></label>
<label>Condiciones en la cotización<textarea rows="3" onchange="cf('cond',this.value)">${E(S.cfg.cond)}</textarea></label>
<h3>Respaldo</h3><button class="btn alt" onclick="bk()">Descargar respaldo</button><label>Restaurar respaldo<input type="file" accept=".json" onchange="rs(this.files[0])"></label>`}
const cf=(k,v)=>{S.cfg[k]=v;save()};
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='adri-sweets-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!d.ings||!d.recs)throw 0;S={...def,...d};save();render();alert('Respaldo restaurado.')}catch(e){alert('Ese archivo no es un respaldo válido.')}};r.readAsText(f)}
let P;addEventListener('beforeinstallprompt',e=>{e.preventDefault();P=e;$('#inst').hidden=false});$('#inst').onclick=()=>{P&&P.prompt();$('#inst').hidden=true};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
