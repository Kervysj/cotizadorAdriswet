const GRACIA=5*864e5,KS='sub_'+APP;
const $g=id=>document.getElementById(id);

const abrir=()=>{$g('gate').style.display='none'};
async function verificar(email){
 email=String(email||'').toLowerCase().trim();if(!email)return;
 $g('gb').disabled=true;$g('gb').textContent='Verificando...';
 try{
  const r=await fetch(SUB_URL+'?action=check&app_id='+APP+'&email='+encodeURIComponent(email));
  const d=await r.json();
  if(d.activo){localStorage[KS]=JSON.stringify({email,t:Date.now()});abrir();return}
  localStorage.removeItem(KS);msg('Suscripción vencida o no encontrada');
 }catch(e){
  let s=null;try{s=JSON.parse(localStorage[KS])}catch(_){}
  if(s&&s.email===email&&Date.now()-s.t<GRACIA){abrir();return}
  $g('gm').textContent='Sin conexión. Conéctate una vez para verificar.';
 }
 $g('gb').disabled=false;$g('gb').textContent='Entrar';
}
$g('gb').onclick=()=>verificar($g('ge').value);
let s=null;try{s=JSON.parse(localStorage[KS])}catch(_){}
if(s){$g('ge').value=s.email;verificar(s.email)}
})();

<script>
const K='adri_v1',UM={g:['g',1],kg:['g',1000],ml:['ml',1],l:['ml',1000],u:['u',1]};

let S;try{S=JSON.parse(localStorage[K]);S.cfg={...def.cfg,...S.cfg}}catch(e){S=null}if(!S||!S.cfg)S=JSON.parse(JSON.stringify(def));S.lotes=S.lotes||[];S.peds=S.peds||[];S.chk=S.chk||{};S.cats=S.cats||[...def.cats];
const save=()=>localStorage[K]=JSON.stringify(S),$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const n=v=>parseFloat(String(v).replace(',','.'))||0,E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=v=>'$'+(+v||0).toFixed(2),bs=v=>'Bs '+((+v||0)*S.cfg.tasa).toLocaleString('es-VE',{maximumFractionDigits:2}),fd=d=>d.split('-').reverse().join('/');
const usd=i=>i.cur==='Bs'?i.price/S.cfg.tasa:i.price,bu=i=>UM[i.unit][0],uc=i=>{const b=i.qty*UM[i.unit][1];return b?usd(i)/b:0};
const ing=id=>S.ings.find(x=>x.id===id),rec=id=>S.recs.find(x=>x.id===id);
function cost(r,f=1,dp=0){let a=0;r.items.forEach(it=>{const i=ing(it.i);if(i)a+=uc(i)*it.q;else{const sb=rec(it.i);if(sb&&dp<4)a+=sum(cost(sb,1,dp+1))/((sb.kg||1)*1000)*it.q}});return{ing:a*f,merma:a*r.merma/100*f,ind:a*S.cfg.ind/100*f,lab:r.horas*S.cfg.mo*f,fijo:r.empaque+r.decor}}
const sum=c=>c.ing+c.merma+c.ind+c.lab+c.fijo,tot=r=>sum(cost(r,1));
function price(c,m){m=Math.min(m,95);const v=c/(1-m/100),r=S.cfg.red;return r>0?Math.ceil(v/r)*r:v}
const TABS=[['q','Cotizar'],['p','Pedidos'],['v','Ventas'],['r','Recetas'],['i','Ingred.'],['m','Más']];
let RC='all',RM=0,RO=0,RT='ing',T='q',R=null,Q={rid:'',mode:'rec',qty:1,extra:0,marg:'',pf:'',inv:20,ppi:1,sz:''},C={nom:'',tel:'',fec:'',nota:''};

/* COTIZAR */
const fn=v=>String(+(+v||0).toFixed(2)),ppk=r=>(r.por||1)/(r.kg||1),pn=x=>Math.floor(x+1e-9),mg=()=>Q.marg===''?S.cfg.margen:n(Q.marg);

function recOpts(sel){const o=r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${E(r.name||'Sin nombre')}</option>`,g=c=>S.recs.filter(r=>grp(r)===c),u=S.cats.filter(c=>g(c).length);if(!u.length)return S.recs.map(o).join('');return u.map(c=>`<optgroup label="${E(c)}">${g(c).map(o).join('')}</optgroup>`).join('')+(g('').length?`<optgroup label="Sin categoría">${g('').map(o).join('')}</optgroup>`:'')}
const setMode=m=>{Q.mode=m;Q.pf='';Q.sz='';render()},qIn=v=>{if(Q.mode==='inv')Q.inv=n(v);else Q.qty=n(v);Q.pf='';Q.sz='';upd()};

const M=[['rec','Por receta'],['por','Por porción'],['inv','Por invitados']],lb={rec:'Cuánto de la receta (1 = completa)',por:'Porciones',inv:'Número de invitados'}[Q.mode];
return`<label>Producto<select onchange="Q.rid=this.value;Q.pf='';Q.sz='';render()">${recOpts(Q.rid)}</select></label>
<div class="seg">${M.map(([k,l])=>`<button class="${Q.mode===k?'on':''}" onclick="setMode('${k}')">${l}</button>`).join('')}</div>
<div class="row"><label>${lb}<input type="text" inputmode="decimal" value="${Q.mode==='inv'?Q.inv:Q.qty}" oninput="qIn(this.value)"></label>${Q.mode==='inv'?`<label>Porciones por invitado<input type="text" inputmode="decimal" value="${Q.ppi}" oninput="Q.ppi=n(this.value);Q.sz='';Q.pf='';upd()"></label>`:''}</div>${Q.mode==='rec'?QB():''}
<div class="row"><label>Extras $<input type="text" inputmode="decimal" value="${Q.extra}" oninput="Q.extra=n(this.value);Q.pf='';upd()"></label><label>Margen de ganancia %<input type="text" inputmode="decimal" value="${Q.marg===''?S.cfg.margen:E(Q.marg)}" oninput="Q.marg=this.value;Q.pf='';upd()"></label></div><div id="mh" class="hint"></div>
<div id="eq" class="hint" style="margin-top:8px"></div><div id="sgw"></div>
<div id="res"><div class="kv"><span>Tu costo</span><b id="rc"></b></div><div style="margin-top:8px;color:var(--mut)">Precio sugerido</div><div id="rp"></div><div id="rpb" class="hint"></div>
<div class="kv"><span>Tu ganancia</span><b id="rg"></b></div><div class="kv"><span>Precio unitario</span><b id="ru"></b></div>
<label>Precio final (opcional, si quieres otro)<input id="pf" type="text" inputmode="decimal" oninput="Q.pf=this.value;upd()"></label><button class="btn" onclick="add()">Agregar a la cotización</button></div>`+cartH()}
const fr=v=>{const w=Math.floor(v+1e-9),m=v-w,t=Math.abs(m-.25)<1e-9?'¼':Math.abs(m-.5)<1e-9?'½':Math.abs(m-.75)<1e-9?'¾':'';return Math.abs(m)<1e-9?String(w):t?(w?w:'')+t:fn(v)};
const QB=()=>`<div class="sg">${[.25,.5,1,2].map(v=>`<button class="${Q.qty===v?'on':''}" onclick="Q.qty=${v};Q.pf='';render()">${fr(v)}</button>`).join('')}</div>`;
const dsc=(f,P)=>`${f===1?'Receta completa':fr(f)+' de la receta'} (≈ ${pn(f*P)} porciones)`;
function calc(){const r=rec(Q.rid);if(!r)return null;const P=r.por||1,m=mg();let f,need=0,rk=0,desc;
if(Q.mode==='rec'){f=Q.qty;desc=dsc(f,P)}
else if(Q.mode==='por'){f=Q.qty/P;desc=`${fn(Q.qty)} porciones`}
else{need=Math.ceil((Q.inv||0)*(Q.ppi||1)-1e-9);rk=Math.max(.25,Math.ceil(need/P*4-1e-9)/4);f=Q.sz===''?rk:n(Q.sz);desc=dsc(f,P)+` para ${fn(Q.inv)} invitados`}
const t=sum(cost(r,f))+Q.extra;return{r,t,f,p:price(t,m),por:pn(f*P),need,rk,desc}}
function qH(c){const P=c.r.por||1;if(Q.mode==='rec')return`La receta completa rinde <b>${P} porciones</b>. Con ${fr(Q.qty)} de la receta salen ≈ ${c.por} porciones.`;if(Q.mode==='por')return`Equivale a ${fr(c.f)} de la receta (la receta completa rinde ${P} porciones).`;return`${fn(Q.inv)} invitados × ${fn(Q.ppi)} = <b>${c.need} porciones</b>. La receta completa rinde ${P}. Elige cuánto preparar:`}
function sgH(c){const r=c.r,P=r.por||1,m=mg(),o=[c.rk-.25,c.rk,c.rk+.25].filter(k=>k>=.25);return`<div class="sg">`+o.map(k=>{const p=price(sum(cost(r,k))+Q.extra,m),por=pn(k*P),fa=c.need-por;return`<button class="${Math.abs(k-c.f)<1e-9?'on':''}" onclick="Q.sz=${k};Q.pf='';upd()">${fr(k)} receta<small>${por} porciones · ${fm(p)}</small><small>${Math.abs(k-c.rk)<1e-9?'Recomendada':fa>0?'Faltan '+fa+' porc.':'Sobran '+(por-c.need)+' porc.'}</small></button>`}).join('')+`</div>`}
function upd(){const c=calc();if(!c||!$('#rc'))return;const pf=n(Q.pf)||c.p,u=Q.mode==='rec'?fm(pf/(c.por||1))+' por porción':Q.mode==='por'?fm(pf/(Q.qty||1))+' por porción':fm(pf/(Q.inv||1))+' por invitado · '+fm(pf/(c.por||1))+' por porción';
$('#rc').textContent=fm(c.t);$('#rp').textContent=fm(c.p);$('#rpb').textContent=bs(c.p);
$('#rg').textContent=fm(pf-c.t)+' ('+(pf?((pf-c.t)/pf*100).toFixed(0):0)+'%)';$('#rg').className=pf<c.t?'neg':'';
$('#ru').textContent=u;$('#pf').placeholder=c.p.toFixed(2);$('#eq').innerHTML=qH(c);$('#sgw').innerHTML=Q.mode==='inv'?sgH(c):'';
$('#mh').innerHTML=Q.marg!==''&&mg()!==S.cfg.margen?`Usando ${fn(mg())}% solo en esta cotización (en Ajustes tienes ${S.cfg.margen}%). <button class="lnk" style="padding:0" onclick="Q.marg='';Q.pf='';render()">Volver al de Ajustes</button>`:`Es tu margen de Ajustes (${S.cfg.margen}%). Cámbialo aquí si este cliente es especial.`}
function add(){const c=calc();if(!c||!(Q.mode==='inv'?Q.inv:Q.qty))return;S.cart.push({t:`${c.r.name} · ${c.desc}`,p:+(n(Q.pf)||c.p).toFixed(2),rid:c.r.id,f:c.f,c:+c.t.toFixed(2)});Q.pf='';save();render()}
function cartH(){const t=S.cart.reduce((a,l)=>a+l.p,0);return`<h3>Cotización para el cliente</h3>`+(S.cart.length?S.cart.map((l,i)=>`<div class="line"><span>${E(l.t)}</span><b>${fm(l.p)}</b><button class="x" aria-label="Quitar" onclick="S.cart.splice(${i},1);save();render()">✕</button></div>`).join('')+`<div class="line tot"><span>Total</span><b>${fm(t)}</b></div>
<div class="row"><label>Cliente<input value="${E(C.nom)}" oninput="C.nom=this.value"></label><label>Teléfono<input type="tel" inputmode="tel" value="${E(C.tel)}" oninput="C.tel=this.value"></label></div><div class="row"><label>Fecha del evento<input type="date" value="${C.fec}" oninput="C.fec=this.value"></label><label>Abono %<input type="number" value="${S.cfg.abono}" oninput="S.cfg.abono=n(this.value);save()"></label></div>

function mkQ(){const q={d:Date.now(),nom:C.nom,fec:C.fec,nota:C.nota,lines:S.cart.map(l=>({...l})),tot:S.cart.reduce((a,l)=>a+l.p,0),ab:S.cfg.abono};q.k=JSON.stringify([q.nom,q.fec,q.nota,q.lines,q.ab]);if(S.hist[0]&&S.hist[0].k===q.k)S.hist[0].d=q.d;else S.hist.unshift(q);S.hist=S.hist.slice(0,200);save();return q}
const qtxt=q=>{const ab=q.tot*q.ab/100;return`*${S.cfg.biz} · Cotización*\n`+(q.nom?`Cliente: ${q.nom}\n`:'')+(q.fec?`Fecha del evento: ${fd(q.fec)}\n`:'')+'\n'+q.lines.map(l=>`• ${l.t}: ${fm(l.p)}`).join('\n')+(q.nota?`\n\n${q.nota}`:'')+`\n\n*Total: ${fm(q.tot)}*`+(S.cfg.tasa>1?` (${bs(q.tot)})`:'')+`\nAbono para reservar (${q.ab}%): ${fm(ab)}\nSaldo: ${fm(q.tot-ab)}`+(payTxt().length?'\n\n*Formas de pago*\n'+payTxt().join('\n'):'')+`\n\n${S.cfg.cond}`};

function vM(){return`<div class="seg">${[['rep','Reporte'],['hist','Cotizaciones'],['aj','Ajustes']].map(([k,l])=>`<button class="${M_===k?'on':''}" onclick="M_='${k}';render()">${l}</button>`).join('')}</div>`+({rep:vRep,hist:vH,aj:vA})[M_]()}
function vRep(){const t=new Date(),im=x=>{const d=new Date(x);return d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear()},G={};let iv=0,co=0;
S.peds.filter(p=>p.done&&im(p.dd||p.d)).forEach(p=>p.lines.forEach(l=>{iv+=l.p;co+=l.c||0;const k=(rec(l.rid)||{}).name||l.t;G[k]=(G[k]||0)+l.p-(l.c||0)}));
S.lotes.filter(l=>!l.plan&&im(l.d)).forEach(l=>{const v=sold(l)*l.pp;iv+=v;co+=l.cost;G[l.name]=(G[l.name]||0)+v-l.cost});
const top=Object.entries(G).sort((a,b)=>b[1]-a[1])[0];
return`<h3>Este mes</h3><div class="grid">${cd('Vendido',fm(iv))}${cd('Costos',fm(co))}${cd('Ganancia',fm(iv-co))}${cd('Más rentable',top?E(top[0])+'<br><small>'+fm(top[1])+'</small>':'—')}</div>`}
/* HISTORIAL */
function vH(){return S.hist.length?S.hist.map((q,i)=>`<div class="card"><b>${E(q.nom||'Sin nombre')}</b> · ${fm(q.tot)}<div class="meta"><span>${new Date(q.d).toLocaleDateString('es-VE')}${q.fec?' · evento '+fd(q.fec):''}</span></div><div class="meta">${E(q.lines.map(l=>l.t).join(', '))}</div>
<div class="row"><button class="btn alt" onclick="share(S.hist[${i}])">Reenviar</button><button class="btn alt" onclick="dupH(${i})">Duplicar</button><button class="btn alt" onclick="if(confirm('¿Borrar?')){S.hist.splice(${i},1);save();render()}">Borrar</button></div></div>`).join(''):`<p class="empty">Aquí aparecerán las cotizaciones que envíes.</p>`}
function dupH(i){const q=S.hist[i];S.cart=q.lines.map(l=>({...l}));C={nom:q.nom,fec:q.fec,nota:q.nota};go('q')}
/* AJUSTES */
function vA(){const g=(k,l,h='')=>`<label>${l}<input type="text" inputmode="decimal" value="${S.cfg[k]}" onchange="cf('${k}',n(this.value))"></label>${h?`<div class="hint">${h}</div>`:''}`;
return HP('¿Qué es esto?','Son tus reglas generales: el <b>margen</b> es lo que quieres ganar sobre el precio de venta, la <b>tasa</b> convierte los Bs a $, y las <b>formas de pago</b> salen en tus cotizaciones y recordatorios.')+`<label>Nombre del negocio<input value="${E(S.cfg.biz)}" onchange="cf('biz',this.value)"></label><label>Teléfono (sale en la cotización)<input value="${E(S.cfg.tel)}" onchange="cf('tel',this.value)"></label>
${g('tasa','Tasa del dólar (Bs por $1)')}${g('margen','Margen de ganancia % (sobre el precio de venta)')}${g('mo','Tu hora de trabajo $')}${g('ind','Gas, luz y otros % (sobre ingredientes)')}${g('abono','Abono para reservar %')}${g('red','Redondear precio hacia arriba a múltiplos de $')}
<h3>Formas de pago (salen en la cotización)</h3><label>Pago móvil (banco, teléfono, cédula)<textarea rows="2" onchange="cf('pm',this.value)">${E(S.cfg.pm)}</textarea></label><label>Binance (correo o Pay ID)<input value="${E(S.cfg.bin)}" onchange="cf('bin',this.value)"></label>
<label>Condiciones en la cotización<textarea rows="3" onchange="cf('cond',this.value)">${E(S.cfg.cond)}</textarea></label>
<h3>Respaldo</h3><button class="btn alt" onclick="bk()">Descargar respaldo</button><label>Restaurar respaldo<input type="file" accept=".json" onchange="rs(this.files[0])"></label>`}
const cf=(k,v)=>{S.cfg[k]=v;save()};
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='adri-sweets-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!d.ings||!d.recs)throw 0;S={...def,...d};S.cats=d.cats||[...def.cats];save();render();alert('Respaldo restaurado.')}catch(e){alert('Ese archivo no es un respaldo válido.')}};r.readAsText(f)}
let P;addEventListener('beforeinstallprompt',e=>{e.preventDefault();P=e;$('#inst').hidden=false});$('#inst').onclick=()=>{P&&P.prompt();$('#inst').hidden=true};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
